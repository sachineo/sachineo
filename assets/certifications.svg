      <text x="18" y="27" fill="#00d9ff" font-size="11">IBM-07 // SYSTEM SECURITY</text><text x="18" y="72" fill="#f2fff9" font-size="15" font-weight="700">OPERATING SYSTEM</text><text x="18" y="94" fill="#f2fff9" font-size="15" font-weight="700">SECURITY</text><text x="18" y="116" fill="#8297a3" font-size="11">IBM CERTIFIED</text><text x="18" y="151" fill="#00ff9c" font-size="11">STATUS // LISTED</text>
