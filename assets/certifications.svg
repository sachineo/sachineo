      <text x="18" y="27" fill="#00d9ff" font-size="11">NET-08 // WIRESHARK</text><text x="18" y="72" fill="#f2fff9" font-size="15" font-weight="700">WIRESHARK NETWORK</text><text x="18" y="94" fill="#f2fff9" font-size="15" font-weight="700">ANALYST</text><text x="18" y="116" fill="#8297a3" font-size="11">TRAFFIC ANALYSIS</text><text x="18" y="151" fill="#00ff9c" font-size="11">STATUS // LISTED</text>
