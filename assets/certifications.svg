<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
  <title id="title">Sachin T listed cybersecurity credentials</title>
  <desc id="desc">Cybersecurity credential cards for certifications listed on Sachin T's portfolio.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00ff9c" stroke-opacity=".035"/></pattern>
    <linearGradient id="scan" x1="0" x2="1"><stop stop-color="#00d9ff" stop-opacity="0"/><stop offset=".5" stop-color="#00d9ff" stop-opacity=".55"/><stop offset="1" stop-color="#00d9ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="violetScan" x1="0" x2="1"><stop stop-color="#b026ff" stop-opacity="0"/><stop offset=".5" stop-color="#b026ff" stop-opacity=".72"/><stop offset="1" stop-color="#b026ff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    text{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}.pulse{animation:pulse 2.6s ease-in-out infinite}.scan{animation:scan 10s linear infinite}.credential-scan{animation:credentialScan 12s ease-in-out infinite}.cert{animation:certGlow 18s ease-in-out infinite}.c2{animation-delay:2s}.c3{animation-delay:4s}.c4{animation-delay:6s}.c5{animation-delay:8s}.c6{animation-delay:10s}.c7{animation-delay:12s}.c8{animation-delay:14s}.c9{animation-delay:16s}
    @keyframes pulse{50%{opacity:.25}}@keyframes scan{from{transform:translateX(-900px)}to{transform:translateX(1000px)}}@keyframes credentialScan{0%,8%,100%{opacity:0;transform:translateY(0)}14%{opacity:.8}76%{opacity:.3;transform:translateY(548px)}84%{opacity:0;transform:translateY(548px)}}@keyframes certGlow{0%,9%,100%{stroke:#27333b}4.5%{stroke:#b026ff}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1000" height="710" rx="16" fill="#080d12"/>
  <rect x="1.5" y="1.5" width="997" height="707" rx="14.5" fill="url(#grid)" stroke="#27333b" stroke-width="3"/>
  <path d="M18 16h38M18 16v20M982 16h-38M982 16v20M18 694h38M18 694v-20M982 694h-38M982 694v-20" stroke="#00ff9c" stroke-width="2"/>
