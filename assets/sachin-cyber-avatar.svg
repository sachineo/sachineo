<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Sachin T animated cyber identity avatar</title>
  <desc id="desc">Sachin T's supplied portrait preserved inside an animated biometric scanner with rotating HUD rings, targeting corners, particles, and verified identity status.</desc>
  <defs>
    <clipPath id="face"><circle cx="300" cy="278" r="196"/></clipPath>
    <radialGradient id="shade">
      <stop offset=".66" stop-color="#050807" stop-opacity="0"/>
      <stop offset="1" stop-color="#050807" stop-opacity=".68"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#00ff88" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff88" stop-opacity=".74"/>
      <stop offset="1" stop-color="#11d9ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff88" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
    .r1{transform-origin:300px 278px;animation:r1 16s linear infinite}
    .r2{transform-origin:300px 278px;animation:r2 11s linear infinite}
    .scan{animation:scan 5.2s ease-in-out infinite}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    .n1{animation:node 3s ease-in-out infinite}.n2{animation:node 3s 1s ease-in-out infinite}.n3{animation:node 3s 2s ease-in-out infinite}
    .verify{animation:verify 7s steps(1,end) infinite}
    .glitch{animation:glitch 9s steps(1,end) infinite}
    @keyframes r1{to{transform:rotate(360deg)}}@keyframes r2{to{transform:rotate(-360deg)}}
    @keyframes scan{0%,15%{transform:translateY(-205px);opacity:0}22%{opacity:1}62%{transform:translateY(205px);opacity:.85}69%,100%{opacity:0}}
    @keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}
    @keyframes node{0%,100%{opacity:.24}50%{opacity:1}}
    @keyframes verify{0%,18%{opacity:.35}19%,100%{opacity:1}}
    @keyframes glitch{0%,92%,94%,100%{transform:none}92.5%{transform:translateX(2px)}93%{transform:translateX(-2px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="600" height="600" rx="28" fill="#050807"/>
  <rect x="1.5" y="1.5" width="597" height="597" rx="26.5" fill="url(#grid)" stroke="#00ff88" stroke-opacity=".42" stroke-width="3"/>
  <path d="M24 86V24h62M514 24h62v62M24 514v62h62M514 576h62v-62" fill="none" stroke="#11d9ff" stroke-opacity=".62" stroke-width="2"/>
  <text class="mono" x="30" y="48" font-size="12" fill="#82a89a">BIOMETRIC_ID // SACHIN_T</text>
  <circle cx="559" cy="43" r="5" fill="#00ff88" class="pulse" filter="url(#glow)"/>
  <text class="mono" x="454" y="47" font-size="11" fill="#00ff88">ONLINE</text>

  <circle cx="300" cy="278" r="215" fill="#020504" stroke="#00ff88" stroke-opacity=".12"/>
  <g clip-path="url(#face)" class="glitch">
    <image x="104" y="82" width="392" height="392" preserveAspectRatio="xMidYMid slice"
      href="https://raw.githubusercontent.com/sachineo/sachineo/main/assets/sachin-portrait.png"
      xlink:href="https://raw.githubusercontent.com/sachineo/sachineo/main/assets/sachin-portrait.png"/>
    <circle cx="300" cy="278" r="196" fill="url(#shade)"/>
    <g class="scan">
      <rect x="104" y="254" width="392" height="48" fill="url(#scan)"/>
      <path d="M114 278h372" stroke="#00ff88" stroke-width="2.5" filter="url(#glow)"/>
      <path d="M138 271h78m168 0h78" stroke="#11d9ff" stroke-width="1"/>
    </g>
  </g>
  <circle cx="300" cy="278" r="196" fill="none" stroke="#00ff88" stroke-width="3" class="pulse" filter="url(#glow)"/>

  <g class="r1" fill="none" stroke="#00d9c0">
    <circle cx="300" cy="278" r="218" stroke-opacity=".6" stroke-dasharray="7 12 44 14"/>
    <path d="M300 51v22M300 483v22M73 278h22M505 278h22" stroke-width="3"/>
    <circle cx="300" cy="60" r="4" fill="#11d9ff" stroke="none" filter="url(#glow)"/>
  </g>
  <g class="r2" fill="none" stroke="#11d9ff">
    <circle cx="300" cy="278" r="232" stroke-opacity=".36" stroke-dasharray="2 16 24 9"/>
    <path d="M135 113l15 15M465 113l-15 15M135 443l15-15M465 443l-15-15" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#00ff88" stroke-width="3" class="pulse">
    <path d="M129 164v-34h34M471 164v-34h-34M129 392v34h34M471 392v34h-34"/>
  </g>

  <g class="mono" font-size="10" fill="#00d9c0">
    <text x="41" y="160">WEB</text><path d="M67 157h56" stroke="#00d9c0" stroke-opacity=".5"/>
    <text x="32" y="407">OSINT</text><path d="M72 404h49" stroke="#00d9c0" stroke-opacity=".5"/>
    <text x="510" y="160">VAPT</text><path d="M477 157h29" stroke="#00d9c0" stroke-opacity=".5"/>
    <text x="518" y="407">NET</text><path d="M479 404h35" stroke="#00d9c0" stroke-opacity=".5"/>
  </g>
  <g fill="#00ff88" filter="url(#glow)">
    <circle cx="115" cy="104" r="3" class="n1"/><circle cx="489" cy="452" r="3" class="n2"/><circle cx="514" cy="222" r="2.5" class="n3"/>
  </g>

  <rect x="86" y="512" width="428" height="58" rx="10" fill="#00ff88" fill-opacity=".045" stroke="#00ff88" stroke-opacity=".34"/>
  <g class="verify">
    <text class="mono" x="300" y="536" text-anchor="middle" font-size="12" fill="#82a89a">IDENTITY MATCH // ACCESS AUTHORIZED</text>
    <text class="mono" x="300" y="558" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="2" fill="#00ff88" filter="url(#glow)">SACHIN T // VERIFIED</text>
  </g>
</svg>
