<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Sachin T cybersecurity skills matrix</title>
  <desc id="desc">Animated terminal-style bars showing published skill levels in training, penetration testing, ethical hacking, web security, and related areas.</desc>
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop stop-color="#00ff88"/><stop offset=".68" stop-color="#00d9c0"/><stop offset=".92" stop-color="#11d9ff"/><stop offset="1" stop-color="#b026ff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#00ff88" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <style>
    text{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
    .fill{transform-box:fill-box;transform-origin:left;animation:load 12s cubic-bezier(.2,.7,.2,1) infinite}
    .d2{animation-delay:.08s}.d3{animation-delay:.16s}.d4{animation-delay:.24s}.d5{animation-delay:.32s}
    .d6{animation-delay:.4s}.d7{animation-delay:.48s}.d8{animation-delay:.56s}.d9{animation-delay:.64s}.d10{animation-delay:.72s}
    .dot{animation:pulse 2.3s ease-in-out infinite}
    @keyframes load{0%,5%{transform:scaleX(0);opacity:.35}22%,91%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(0);opacity:.35}}
    @keyframes pulse{50%{opacity:.3}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1000" height="540" rx="18" fill="#050807"/>
  <rect x="1.5" y="1.5" width="997" height="537" rx="16.5" fill="url(#grid)" stroke="#00ff88" stroke-opacity=".44" stroke-width="3"/>
  <path d="M24 72h952" stroke="#00ff88" stroke-opacity=".18"/>
  <text x="28" y="42" fill="#00ff88" font-size="18" font-weight="700">&gt; SECURITY CAPABILITY MATRIX</text>
  <circle cx="950" cy="36" r="5" fill="#00ff88" class="dot"/>
  <text x="874" y="40" fill="#82a89a" font-size="11">SYNCED</text>

  <g font-size="13">
    <g transform="translate(30 95)">
      <text y="13" fill="#b9d8cc">TRAINING &amp; MENTORSHIP</text><rect x="330" width="580" height="18" rx="4" fill="#0d1b17"/><rect class="fill" x="330" width="562.6" height="18" rx="4" fill="url(#bar)"/><text x="930" y="14" fill="#00ff88">97%</text>
    </g>
    <g transform="translate(30 137)">
      <text y="13" fill="#b9d8cc">PENETRATION TESTING</text><rect x="330" width="580" height="18" rx="4" fill="#0d1b17"/><rect class="fill d2" x="330" width="551" height="18" rx="4" fill="url(#bar)"/><text x="930" y="14" fill="#00ff88">95%</text>
    </g>
    <g transform="translate(30 179)">
      <text y="13" fill="#b9d8cc">ETHICAL HACKING</text><rect x="330" width="580" height="18" rx="4" fill="#0d1b17"/><rect class="fill d3" x="330" width="539.4" height="18" rx="4" fill="url(#bar)"/><text x="930" y="14" fill="#00ff88">93%</text>
    </g>
    <g transform="translate(30 221)">
      <text y="13" fill="#b9d8cc">VULNERABILITY ASSESSMENT</text><rect x="330" width="580" height="18" rx="4" fill="#0d1b17"/><rect class="fill d4" x="330" width="533.6" height="18" rx="4" fill="url(#bar)"/><text x="930" y="14" fill="#00ff88">92%</text>
    </g>
    <g transform="translate(30 263)">
      <text y="13" fill="#b9d8cc">WEB APP SECURITY / OWASP</text><rect x="330" width="580" height="18" rx="4" fill="#0d1b17"/><rect class="fill d5" x="330" width="522" height="18" rx="4" fill="url(#bar)"/><text x="930" y="14" fill="#00ff88">90%</text>
    </g>
    <g transform="translate(30 305)">
      <text y="13" fill="#b9d8cc">BUG HUNTING</text><rect x="330" width="580" height="18" rx="4" fill="#0d1b17"/><rect class="fill d6" x="330" width="510.4" height="18" rx="4" fill="url(#bar)"/><text x="930" y="14" fill="#00ff88">88%</text>
    </g>
    <g transform="translate(30 347)">
      <text y="13" fill="#b9d8cc">NETWORK SECURITY</text><rect x="330" width="580" height="18" rx="4" fill="#0d1b17"/><rect class="fill d7" x="330" width="510.4" height="18" rx="4" fill="url(#bar)"/><text x="930" y="14" fill="#00ff88">88%</text>
    </g>
    <g transform="translate(30 389)">
      <text y="13" fill="#b9d8cc">OSINT &amp; THREAT INTELLIGENCE</text><rect x="330" width="580" height="18" rx="4" fill="#0d1b17"/><rect class="fill d8" x="330" width="493" height="18" rx="4" fill="url(#bar)"/><text x="930" y="14" fill="#00ff88">85%</text>
    </g>
    <g transform="translate(30 431)">
      <text y="13" fill="#b9d8cc">LINUX &amp; WINDOWS SECURITY</text><rect x="330" width="580" height="18" rx="4" fill="#0d1b17"/><rect class="fill d9" x="330" width="493" height="18" rx="4" fill="url(#bar)"/><text x="930" y="14" fill="#00ff88">85%</text>
    </g>
    <g transform="translate(30 473)">
      <text y="13" fill="#b9d8cc">INCIDENT RESPONSE</text><rect x="330" width="580" height="18" rx="4" fill="#0d1b17"/><rect class="fill d10" x="330" width="464" height="18" rx="4" fill="url(#bar)"/><text x="930" y="14" fill="#00ff88">80%</text>
    </g>
  </g>
  <text x="30" y="520" fill="#536b63" font-size="11">CAPABILITY TELEMETRY // OPERATOR PROFILE // ONLINE</text>
</svg>
