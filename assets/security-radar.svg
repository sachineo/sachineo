<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Sachin T security radar and system status</title>
  <desc id="desc">Animated security radar monitoring web, network, OSINT, cloud, and VAPT areas beside an online identity status panel.</desc>
  <defs>
    <radialGradient id="sweep">
      <stop stop-color="#00ff88" stop-opacity=".52"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#00ff88" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <style>
    text{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
    .sweep{transform-origin:238px 202px;animation:spin 7s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}.p2{animation-delay:.7s}.p3{animation-delay:1.4s}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.25}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1000" height="390" rx="16" fill="#050807"/>
  <rect x="1.5" y="1.5" width="997" height="387" rx="14.5" fill="url(#grid)" stroke="#00ff88" stroke-opacity=".42" stroke-width="3"/>
  <path d="M500 25v340" stroke="#00ff88" stroke-opacity=".18"/>
  <text x="28" y="42" font-size="16" font-weight="700" fill="#00ff88">&gt; SECURITY RADAR</text>
  <g fill="none" stroke="#00d9c0" stroke-opacity=".42">
    <circle cx="238" cy="202" r="128"/><circle cx="238" cy="202" r="94"/><circle cx="238" cy="202" r="60"/><circle cx="238" cy="202" r="27"/>
    <path d="M110 202h256M238 74v256M147 111l182 182M329 111L147 293"/>
  </g>
  <path class="sweep" d="M238 202V74A128 128 0 0 1 355 150Z" fill="url(#sweep)"/>
  <circle cx="238" cy="202" r="4" fill="#00ff88"/>
  <g fill="#00ff88">
    <circle class="pulse" cx="180" cy="139" r="5"/><circle class="pulse p2" cx="302" cy="236" r="4"/><circle class="pulse p3" cx="205" cy="285" r="4"/>
  </g>
  <g font-size="11" fill="#82a89a">
    <text x="214" y="65">WEB</text><text x="360" y="205">NETWORK</text><text x="205" y="350">OSINT</text><text x="66" y="205">CLOUD</text><text x="344" y="105">VAPT</text>
  </g>

  <g transform="translate(540 66)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#00ff88">&gt; SYSTEM STATUS</text>
    <path d="M0 20h414" stroke="#00ff88" stroke-opacity=".24"/>
    <g font-size="13">
      <text x="0" y="64" fill="#536b63">IDENTITY</text><text x="180" y="64" fill="#e6fff4">SACHIN T</text>
      <text x="0" y="105" fill="#536b63">ROLE</text><text x="180" y="105" fill="#e6fff4">SECURITY RESEARCHER</text>
      <text x="0" y="146" fill="#536b63">LOCATION</text><text x="180" y="146" fill="#e6fff4">COIMBATORE / INDIA</text>
      <text x="0" y="187" fill="#536b63">STATUS</text><circle cx="186" cy="182" r="5" fill="#00ff88" class="pulse"/><text x="202" y="187" fill="#00ff88">ONLINE</text>
      <text x="0" y="228" fill="#536b63">MISSION</text><text x="180" y="228" fill="#00d9c0">SECURE THE WEB</text>
      <text x="0" y="269" fill="#536b63">ACCESS</text><text x="180" y="269" fill="#00ff88">AUTHORIZED</text>
    </g>
  </g>
</svg>
