name: Generate contribution snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate neon SVG snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300ff88&color_dots=%23ebedf0,%230d3b2a,%2300a85a,%2300d9c0,%2311d9ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300ff88&color_dots=%23050807,%23072d20,%2300a85a,%2300d9c0,%2311d9ff

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
